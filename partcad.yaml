# The code_saturne implementation of PartCAD's flow analysis.
#
# The structure is identical to `//builtin/export` and `//builtin/render` -- see
# `docs/source/config_output.rst` in the `partcad` repository for what each field
# means. What makes it an analysis is the section it is declared in: `cae:`. It
# writes binary glTF, the result being a 3D field the Digital Thread turns and
# zooms, and answers with `findings` beside it: an empty list is a pass, and is
# what `pc test` requires.

name: //pub/feature/cae/code_saturne
desc: |
  Steady, laminar, incompressible flow analysis, by
  [code_saturne](https://www.code-saturne.org/), EDF's finite volume CFD solver.

  The part is the fluid volume. Its inlets draw from a reservoir at the pressure
  their `load:` puts over the area their sketch covers, its outlets are held at
  the reference pressure, and every other surface is a no-slip wall. The result
  is the boundary coloured by pressure, and the flow rate, speeds and Reynolds
  number as measurements.

# What the script imports. Declared even though the image carries gmsh, because
# `dockerImage` says where the analysis runs *best*, not where it runs at all: a
# host with code_saturne installed runs this package in a conda or venv sandbox
# like any other. code_saturne itself is a native solver, not a Python package:
# that is what the image is for, or a local installation (see README.md).
pythonRequirements:
  - gmsh; platform_machine != "aarch64"
  - numpy

cae:
  cfd:
    desc: Steady laminar incompressible flow through the part, as a glTF coloured by pressure plus findings.
    path: cfd_code_saturne.py
    extension: glb
    # code_saturne built from a pinned release on PartCAD's base image, for amd64
    # and arm64. The tag is a hash of what the image is built from (see
    # `image-tag.sh`), and PartCAD appends the architecture.
    dockerImage: ghcr.io/partcad/partcad-cae-code-saturne:956180bc0221
    # How long a solve may be silent before PartCAD's client gives up on it, in
    # seconds: a flow is the slowest analysis there is, and the client's default
    # is five minutes. PartCAD announces this window while the analysis runs.
    timeout: 3600

    # How fine the mesh is: the largest tetrahedron, as a fraction of the part's
    # largest dimension.
    mesh_size: 0.05

    # The fluid: air at 20 degrees. kg/m^3, and the dynamic viscosity in Pa*s.
    # Note the signed exponent: YAML 1.1 reads `1.82e-5` as a string.
    density: 1.204
    viscosity: 1.82e-5

    # The solver: how many steps of the steady algorithm, and by how much the
    # residuals have to fall from the first step for the flow to count as
    # settled. Not settling is a finding, never a quiet answer.
    iterations: 500
    residual_drop: 1.0e-3

    # What counts as a finding, besides a flow too fast to be laminar: a speed
    # past this (m/s), and, when set, a flow rate short of `min_flow_rate` (m^3/s).
    max_velocity: 50.0
    # min_flow_rate: 1.0e-6
